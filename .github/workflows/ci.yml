name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build and verify the package
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Load the CommonJS entry point
        run: node -e "const sdk=require('./dist/cjs/index.js'); if(typeof sdk.Forum!=='function') throw new Error('Forum is missing from the CommonJS build');"

      - name: Load the ES module entry point
        run: node --input-type=module -e "import('./dist/esm/index.js').then(m => { if (typeof m.Market !== 'function') throw new Error('Market is missing from the ES module build'); });"

      - name: Inspect the publishable tarball
        run: npm pack --dry-run

  install:
    name: Install with ${{ matrix.manager }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, pnpm, yarn]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack the tarball
        id: pack
        run: echo "tarball=$(npm pack --silent)" >> "$GITHUB_OUTPUT"

      # yarn and pnpm are package managers, not registries. They install from
      # registry.npmjs.org just like npm, so this job installs the very tarball
      # that would be published and checks the result under each of them.
      # pnpm matters most: its strict node_modules layout is the one that
      # exposes a package relying on hoisting it never declared.
      - name: Install the package manager
        if: matrix.manager != 'npm'
        run: |
          if [ "${{ matrix.manager }}" = "pnpm" ]; then
            npm install -g pnpm@latest
          else
            npm install -g yarn@1.22.22
          fi

      - name: Install the tarball into a throwaway project
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cp "${{ steps.pack.outputs.tarball }}" "$RUNNER_TEMP/consumer/package.tgz"
          cp scripts/smoke.cjs "$RUNNER_TEMP/consumer/"
          cd "$RUNNER_TEMP/consumer"
          echo '{"name":"consumer","private":true,"license":"MIT"}' > package.json
          case "${{ matrix.manager }}" in
            npm)  npm  install ./package.tgz --no-audit --no-fund ;;
            pnpm) pnpm add  ./package.tgz ;;
            yarn) yarn add  ./package.tgz ;;
          esac

      - name: Run the consumer smoke test
        run: node "$RUNNER_TEMP/consumer/smoke.cjs"
        working-directory: ${{ runner.temp }}/consumer

  codegen:
    name: Verify generated sources are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Regenerate from the committed OpenAPI documents
        run: npm run codegen

      - name: Regenerate the method reference
        run: npm run docs

      - name: Fail if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files are out of date. Run 'npm run codegen && npm run docs' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi
