name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build and verify the package
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Load the CommonJS entry point
        run: node -e "const sdk=require('./dist/cjs/index.js'); if(typeof sdk.Forum!=='function') throw new Error('Forum is missing from the CommonJS build');"

      - name: Load the ES module entry point
        run: node --input-type=module -e "import('./dist/esm/index.js').then(m => { if (typeof m.Market !== 'function') throw new Error('Market is missing from the ES module build'); });"

      - name: Inspect the publishable tarball
        run: npm pack --dry-run

  codegen:
    name: Verify generated sources are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Regenerate from the committed OpenAPI documents
        run: npm run codegen

      - name: Regenerate the method reference
        run: npm run docs

      - name: Fail if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files are out of date. Run 'npm run codegen && npm run docs' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi
